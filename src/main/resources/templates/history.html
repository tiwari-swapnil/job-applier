<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Email History - Job Mailer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .navbar {
            height: 65px;
            background: #1f2937;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: auto;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .sent {
            color: #15803d;
            font-weight: bold;
        }

        .empty {
            color: #666;
            padding: 20px 0;
        }


    </style>

</head>



<nav class="navbar">


    <strong>📧 Job Mailer</strong>

    <a href="/">← Dashboard</a>

</nav>


<div class="container">

    <h1>📜 Email History</h1>


    <div class="card">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Recipient</th>

                <th>Subject</th>

                <th>Status</th>

                <th>Sent At</th>

            </tr>

            </thead>


            <tbody id="historyTable">

            </tbody>

        </table>

        <div id="emptyMessage"
             class="empty"
             style="display:none;">

            No emails have been sent yet.

        </div>

    </div>

</div>


<script>

    async function loadHistory() {

        const table =
            document.getElementById("historyTable");

        const emptyMessage =
            document.getElementById("emptyMessage");


        try {

            const response =
                await fetch("/api/history");

            const history =
                await response.json();


            table.innerHTML = "";


            if (history.length === 0) {

                emptyMessage.style.display =
                    "block";

                return;

            }


            emptyMessage.style.display =
                "none";


            history.forEach(email => {

                const row =
                    document.createElement("tr");


                const date =
                    email.sentAt
                        ? new Date(email.sentAt)
                            .toLocaleString()
                        : "-";


                row.innerHTML = `

                    <td>${email.id}</td>

                    <td>${email.recipientEmail}</td>

                    <td>${email.subject}</td>

                    <td class="sent">
                        ✅ ${email.status}
                    </td>

                    <td>${date}</td>

                `;


                table.appendChild(row);

            });

        }

        catch (error) {

            table.innerHTML = `
                <tr>
                    <td colspan="5">
                        Failed to load email history.
                    </td>
                </tr>
            `;

        }

    }


    loadHistory();

</script>


</body>

</html>
