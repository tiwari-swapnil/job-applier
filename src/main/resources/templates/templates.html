<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Templates - Job Mailer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .navbar {
            height: 65px;
            background: #1f2937;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: auto;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .template {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .template h3 {
            margin-bottom: 8px;
        }

        .subject {
            color: #555;
            margin-bottom: 12px;
        }

        .body {
            background: #f9fafb;
            padding: 15px;
            border-radius: 7px;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .variables {
            background: #eff6ff;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
            color: #1e40af;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <strong>📧 Job Mailer</strong>
    <a href="/">← Dashboard</a>
</nav>

<div class="container">

    <h1>📝 Email Templates</h1>

    <!-- Create Template -->

    <div class="card">

        <h2>Create Template</h2>

        <br>

        <div class="variables">
            <strong>Available variables:</strong>

            <br><br>

            <code>{Name}</code> -
            Contact's name

            <br>

            <code>{Company}</code> -
            Company name

            <br>

            <code>{Position}</code> -
            Job position
        </div>

        <form id="templateForm">

            <div class="form-group">

                <label>Template Name</label>

                <input
                        type="text"
                        id="name"
                        placeholder="Referral Request"
                        required>

            </div>


            <div class="form-group">

                <label>Email Subject</label>

                <input
                        type="text"
                        id="subject"
                        placeholder="Request for Referral - {Position}"
                        required>

            </div>


            <div class="form-group">

                <label>Email Body</label>

                <textarea
                        id="body"
                        placeholder="Hi {Name},

I hope you are doing well.

I am currently looking for opportunities at {Company} for the {Position} role.

Thank you for your time.

Best regards,
Swastik Tiwari"
                        required></textarea>

            </div>


            <button type="submit">
                Create Template
            </button>

        </form>

        <div id="message"></div>

    </div>


    <!-- Saved Templates -->

    <div class="card">

        <h2>Saved Templates</h2>

        <div id="templatesList"></div>

    </div>

</div>


<script>

    const form =
        document.getElementById("templateForm");

    const templatesList =
        document.getElementById("templatesList");

    const message =
        document.getElementById("message");


    // Load templates

    async function loadTemplates() {

        try {

            const response =
                await fetch("/api/templates");

            const templates =
                await response.json();

            templatesList.innerHTML = "";


            if (templates.length === 0) {

                templatesList.innerHTML =
                    "<p>No templates created yet.</p>";

                return;
            }


            templates.forEach(template => {

                const div =
                    document.createElement("div");

                div.className = "template";


                div.innerHTML = `

                    <h3>${template.name}</h3>

                    <div class="subject">
                        <strong>Subject:</strong>
                        ${template.subject}
                    </div>

                    <div class="body">${template.body}</div>

                    <button
                        class="delete-btn"
                        onclick="deleteTemplate(${template.id})">
                        Delete
                    </button>

                `;


                templatesList.appendChild(div);

            });

        } catch (error) {

            templatesList.innerHTML =
                "<p>Failed to load templates.</p>";

        }

    }


    // Create template

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const template = {

                name:
                document.getElementById("name").value,

                subject:
                document.getElementById("subject").value,

                body:
                document.getElementById("body").value

            };


            try {

                const response =
                    await fetch(
                        "/api/templates",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(template)
                        }
                    );


                if (!response.ok) {
                    throw new Error("Failed");
                }


                message.textContent =
                    "Template created successfully!";

                message.style.color = "green";


                form.reset();

                loadTemplates();


            } catch (error) {

                message.textContent =
                    "Failed to create template.";

                message.style.color = "red";

            }

        }
    );


    // Delete template

    async function deleteTemplate(id) {

        if (!confirm("Delete this template?")) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/templates/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                loadTemplates();

            } else {

                alert("Failed to delete template.");

            }

        } catch (error) {

            alert("Something went wrong.");

        }

    }


    // Load templates when page opens

    loadTemplates();

</script>

</body>
</html>
